<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-League Live Scoreboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08080d;color:white;font-family:Arial,sans-serif}
main{position:relative;overflow:hidden;text-align:center;padding:22px;background:linear-gradient(140deg,#35105f,#090810);border:4px solid #f5c542;min-height:400px}
.brand{color:#f5c542;font-size:clamp(15px,3vw,25px);font-weight:900;letter-spacing:4px}
.subtitle,.footer{font-size:11px;letter-spacing:3px;color:#ddd;margin-top:6px}
.clock{font-size:clamp(25px,5vw,40px);font-weight:900;color:#f5c542;margin:20px auto 8px}
.period{font-size:12px;color:#ddd;margin-bottom:18px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{min-width:0}
.name{font-size:clamp(14px,2.5vw,27px);font-weight:900;overflow-wrap:anywhere;text-transform:uppercase}
.score{font-size:clamp(60px,12vw,105px);font-weight:900;line-height:1.15}
.vs{font-weight:900;color:#f5c542;font-size:22px}
.crest{width:85px;height:85px;object-fit:contain;display:none;margin:8px auto}
.footer{color:#f5c542;margin-top:25px}
.controls{background:#17171e;color:white;padding:16px;font-family:Arial,sans-serif}
.controls h3{margin:8px 0;color:#f5c542}
.controls input,.controls select,.controls button{padding:9px;margin:4px;border-radius:5px;border:1px solid #555;max-width:100%}
.controls input{width:150px}
.controls button{cursor:pointer;font-weight:bold;background:#f5c542;color:#151515;border:0}
.controls .dark{background:#333;color:white}
.control-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.goal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;z-index:5;background:#08080df2;--accent:#f5c542}
.goal.active{display:flex}
.goal-content{position:relative;z-index:3;text-align:center;padding:10px}
.goal-team{font-size:clamp(15px,3vw,26px);font-weight:900;letter-spacing:3px;text-transform:uppercase}
.goal-word{font-size:clamp(65px,15vw,145px);font-weight:1000;font-style:italic;line-height:1.1;color:white;-webkit-text-stroke:2px var(--accent);text-shadow:0 0 25px var(--accent);animation:pop .7s ease-out both}
.symbol{font-size:clamp(45px,9vw,85px);display:block}
.flash{position:absolute;inset:0;background:var(--accent);opacity:0;animation:flash .55s}
.particles{position:absolute;inset:-20%;background-image:radial-gradient(circle,var(--accent) 0 3px,transparent 4px),radial-gradient(circle,#fff 0 2px,transparent 3px);background-size:65px 65px,100px 100px;animation:burst 1s ease-out forwards}
@keyframes pop{0%{transform:scale(.1) rotate(-8deg);opacity:0}65%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
@keyframes burst{from{transform:scale(.2);opacity:1}to{transform:scale(1.8) rotate(25deg);opacity:0}}
/* Perth Glory: purple and gold lightning storm */
.goal.perth{--accent:#f5c542;background:radial-gradient(circle,#512080,#090510 75%)}
.goal.perth:before{content:"⚡";position:absolute;font-size:clamp(100px,25vw,220px);animation:lightning .25s infinite alternate}
@keyframes lightning{from{opacity:.15;transform:rotate(-15deg)}to{opacity:.9;transform:rotate(15deg)}}
/* Newcastle Jets: jet crosses the screen */
.goal.newcastle{--accent:#54c8ff}
.goal.newcastle .symbol{animation:jet 1.2s ease-in-out}
@keyframes jet{from{transform:translateX(-100vw) rotate(-10deg)}to{transform:translateX(0)}}
/* Auckland FC: ship sails in, anchor drops */
.goal.auckland{--accent:#00aaff}
.goal.auckland .symbol{animation:ship 1.2s ease-in-out}
@keyframes ship{from{transform:translateX(-100vw)}to{transform:translateX(0)}}
.goal.auckland:after{content:"⚓";position:absolute;font-size:75px;right:8%;bottom:5%;animation:anchor .8s .3s both}
@keyframes anchor{from{transform:translateY(-200px) rotate(-90deg)}to{transform:translateY(0) rotate(0)}}
/* Macarthur: bull charges */
.goal.macarthur{--accent:#dedede}
.goal.macarthur .symbol{animation:bull .75s ease-in}
@keyframes bull{from{transform:translateX(-100vw) scale(1.4)}to{transform:translateX(0) scale(1)}}
/* Melbourne Victory: blue lightning */
.goal.victory{--accent:#168cff}
.goal.victory:before{content:"⚡";position:absolute;font-size:150px;left:5%;top:5%;animation:lightning .2s infinite alternate}
/* Melbourne City: city skyline and rocket */
.goal.city{--accent:#7ad7ff}
.goal.city:after{content:"🏙️";position:absolute;bottom:0;font-size:clamp(70px,15vw,140px);opacity:.45}
.goal.city .symbol{animation:rocket .9s ease-out}
@keyframes rocket{from{transform:translateY(100vh)}to{transform:translateY(0)}}
/* Sydney FC: ocean wave */
.goal.sydney{--accent:#00aaff;background:linear-gradient(#06336a,#001426)}
.goal.sydney:before{content:"🌊";position:absolute;font-size:clamp(100px,25vw,230px);animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(-40px) rotate(-8deg)}to{transform:translateX(40px) rotate(8deg)}}
/* Western Sydney Wanderers: red smoke strike */
.goal.wanderers{--accent:#f13b32;background:radial-gradient(circle,#681010,#09080b 75%)}
.goal.wanderers .goal-word{animation:slashWord .5s ease-out}
@keyframes slashWord{from{transform:translateX(-100vw) skewX(-35deg)}to{transform:translateX(0) skewX(0)}}
/* Central Coast Mariners: ocean */
.goal.mariners{--accent:#00d9d0;background:linear-gradient(#006c80,#00152a)}
.goal.mariners:before{content:"🌊";position:absolute;font-size:clamp(100px,24vw,210px);animation:wave .7s infinite alternate}
/* Adelaide United: red impact */
.goal.adelaide{--accent:#ff3030}
.goal.adelaide .goal-word{animation:redStrike .45s ease-out}
@keyframes redStrike{from{transform:translateX(-100vw) skewX(-30deg)}to{transform:translateX(0) skewX(0)}}
/* Brisbane Roar: lion slashes across GOAL */
.goal.brisbane{--accent:#ff9b32;background:radial-gradient(circle,#63240a,#100804 75%)}
.goal.brisbane .symbol{animation:lionSlash 1s ease-in-out}
.goal.brisbane .goal-word{position:relative}
.goal.brisbane .goal-word:after{content:"";position:absolute;left:-8%;right:-8%;top:48%;height:5px;background:#fff;box-shadow:0 -13px 0 #ff9b32,0 13px 0 #ff9b32;transform:rotate(-15deg);animation:claws .8s .35s both}
@keyframes lionSlash{0%{transform:translate(-100vw,80px) rotate(-20deg) scale(1.4)}70%{transform:translate(20px,-5px) rotate(5deg)}100%{transform:translate(0) rotate(0)}}
@keyframes claws{from{transform:translateX(-100vw) rotate(-15deg);opacity:0}to{transform:translateX(0) rotate(-15deg);opacity:1}}
/* Wellington Phoenix: phoenix rises */
.goal.phoenix{--accent:#ffb52e;background:radial-gradient(circle,#63280a,#100704 75%)}
.goal.phoenix .symbol{animation:rise 1s ease-out}
@keyframes rise{from{transform:translateY(100vh) scale(.3);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@media(max-width:500px){main{padding:15px 8px}.crest{width:55px;height:55px}.teams{gap:5px}}
</style>
</head>
<body>

<main id="board">
  <div class="brand">PERTH GLORY</div>
  <div class="subtitle">LIVE WATCHALONG</div>
  <div class="clock" id="clock">00:00</div>
  <div class="period" id="periodDisplay">KICK-OFF</div>
  <div class="teams">
    <div class="team">
      <img class="crest" id="homeCrest" alt="Home crest">
      <div class="name" id="homeName">PERTH GLORY</div>
      <div class="score" id="homeScore">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="team">
      <img class="crest" id="awayCrest" alt="Away crest">
      <div class="name" id="awayName">OPPONENT</div>
      <div class="score" id="awayScore">0</div>
    </div>
  </div>
  <div class="footer">A-LEAGUE MEN • LIVE</div>

  <div class="goal" id="goalOverlay">
    <div class="flash"></div>
    <div class="particles"></div>
    <div class="goal-content">
      <span class="symbol" id="goalSymbol">⚽</span>
      <div class="goal-team" id="goalTeam">PERTH GLORY</div>
      <div class="goal-word">GOAL!</div>
    </div>
  </div>
</main>

<section class="controls">
  <h3>Scoreboard Controls</h3>
  <div class="control-row">
    <label>Home team <input id="homeInput" value="Perth Glory"></label>
    <label>Home score <input id="homeScoreInput" type="number" min="0" value="0"></label>
  </div>
  <div class="control-row">
    <label>Away team <input id="awayInput" value="Opponent"></label>
    <label>Away score <input id="awayScoreInput" type="number" min="0" value="0"></label>
  </div>
  <div class="control-row">
    <label>Home crest URL <input id="homeCrestInput" placeholder="Paste image URL"></label>
    <label>Away crest URL <input id="awayCrestInput" placeholder="Paste image URL"></label>
  </div>
  <div class="control-row">
    <button onclick="updateBoard()">Update Scoreboard</button>
    <button onclick="startClock()">Start Clock</button>
    <button onclick="pauseClock()">Pause Clock</button>
    <button onclick="resetClock()">Reset Clock</button>
  </div>
  <div class="control-row">
    <label>Set clock (minutes) <input id="clockSet" type="number" min="0" value="0"></label>
    <button onclick="setClock()">Set Clock</button>
    <label>Period
      <select id="periodSelect" onchange="changePeriod()">
        <option>KICK-OFF</option>
        <option>1ST HALF</option>
        <option>HALF-TIME</option>
        <option>2ND HALF</option>
        <option>EXTRA TIME</option>
        <option>FULL-TIME</option>
        <option>PENALTIES</option>
      </select>
    </label>
  </div>
  <h3>Goal Animation</h3>
  <div class="control-row">
    <label>Scoring club
      <select id="clubSelect">
        <option value="perth">Perth Glory</option>
        <option value="newcastle">Newcastle Jets</option>
        <option value="auckland">Auckland FC</option>
        <option value="macarthur">Macarthur FC</option>
        <option value="victory">Melbourne Victory</option>
        <option value="city">Melbourne City</option>
        <option value="sydney">Sydney FC</option>
        <option value="wanderers">Western Sydney Wanderers</option>
        <option value="mariners">Central Coast Mariners</option>
        <option value="adelaide">Adelaide United</option>
        <option value="brisbane">Brisbane Roar</option>
        <option value="phoenix">Wellington Phoenix</option>
      </select>
    </label>
    <button onclick="testGoal()">Test Goal Animation</button>
    <button class="dark" onclick="hideGoal()">Hide Animation</button>
  </div>
  <div class="control-row">
    <button class="dark" onclick="toggleCrests()">Show/Hide Crests</button>
    <button class="dark" onclick="toggleControls()">Hide/Show Controls</button>
  </div>
</section>

<script>
let elapsedSeconds = 0;
let timer = null;
let crestsVisible = false;
let controlsVisible = true;
let goalTimeout = null;

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
}

function renderClock() {
  document.getElementById("clock").textContent = formatTime(elapsedSeconds);
}

function startClock() {
  if (timer !== null) return;
  timer = setInterval(() => {
    elapsedSeconds++;
    renderClock();
  }, 1000);
}

function pauseClock() {
  clearInterval(timer);
  timer = null;
}

function resetClock() {
  pauseClock();
  elapsedSeconds = 0;
  renderClock();
}

function setClock() {
  const mins = Math.max(0, Number(document.getElementById("clockSet").value) || 0);
  elapsedSeconds = Math.floor(mins * 60);
  renderClock();
}

function changePeriod() {
  document.getElementById("periodDisplay").textContent =
    document.getElementById("periodSelect").value;
}

function setCrest(imgId, url) {
  const img = document.getElementById(imgId);
  img.onerror = () => {
    img.style.display = "none";
  };
  if (url.trim()) {
    img.src = url.trim();
    img.style.display = crestsVisible ? "block" : "none";
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
  }
}

function updateBoard() {
  document.getElementById("homeName").textContent =
    document.getElementById("homeInput").value || "HOME";
  document.getElementById("awayName").textContent =
    document.getElementById("awayInput").value || "AWAY";

  document.getElementById("homeScore").textContent =
    Math.max(0, Number(document.getElementById("homeScoreInput").value) || 0);
  document.getElementById("awayScore").textContent =
    Math.max(0, Number(document.getElementById("awayScoreInput").value) || 0);

  setCrest("homeCrest", document.getElementById("homeCrestInput").value);
  setCrest("awayCrest", document.getElementById("awayCrestInput").value);
}

function showGoal(club, teamName) {
  const overlay = document.getElementById("goalOverlay");
  const symbols = {
    perth: "⚡",
    newcastle: "✈️",
    auckland: "⛵",
    macarthur: "🐂",
    victory: "⚡",
    city: "🚀",
    sydney: "🌊",
    wanderers: "🔥",
    mariners: "🌊",
    adelaide: "🔴",
    brisbane: "🦁",
    phoenix: "🔥"
  };

  overlay.className = "goal " + club;
  document.getElementById("goalSymbol").textContent = symbols[club] || "⚽";
  document.getElementById("goalTeam").textContent = teamName || club.toUpperCase();

  overlay.classList.remove("active");
  void overlay.offsetWidth;
  overlay.classList.add("active");

  clearTimeout(goalTimeout);
  goalTimeout = setTimeout(hideGoal, 5000);
}

function testGoal() {
  const club = document.getElementById("clubSelect").value;
  const homeClub = document.getElementById("homeInput").value.trim();
  const awayClub = document.getElementById("awayInput").value.trim();
  const selected = prompt(
    "Who scored? Enter H for home or A for away.",
    "H"
  );

  if (selected === null) return;

  const scoringTeam = selected.toUpperCase() === "A" ? awayClub : homeClub;
  showGoal(club, scoringTeam || "GOAL!");
}

function hideGoal() {
  document.getElementById("goalOverlay").classList.remove("active");
  clearTimeout(goalTimeout);
}

function toggleCrests() {
  crestsVisible = !crestsVisible;
  ["homeCrest", "awayCrest"].forEach(id => {
    const img = document.getElementById(id);
    img.style.display = crestsVisible && img.src ? "block" : "none";
  });
}

function toggleControls() {
  controlsVisible = !controlsVisible;
  document.querySelector(".controls").style.display =
    controlsVisible ? "block" : "none";
}

updateBoard();
renderClock();
</script>
</body>
</html>
