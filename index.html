<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-League Scoreboard</title>
<style>
:root{--gold:#f5c542;--purple:#35105f;--accent:#f5c542}
*{box-sizing:border-box}
body{margin:0;background:#101016;color:white;font-family:Arial,Helvetica,sans-serif}
.board{position:relative;overflow:hidden;text-align:center;padding:22px 14px;min-height:380px;border:4px solid var(--gold);background:radial-gradient(ellipse at top,#48206c,#0a0910 75%)}
.brand{font-weight:900;font-size:clamp(16px,3vw,26px);letter-spacing:4px;color:var(--gold)}
.sub{font-size:11px;letter-spacing:3px;margin-top:5px;color:#ddd}
.clock{margin:17px auto 7px;color:var(--gold);font-weight:900;font-size:clamp(27px,5vw,40px);font-variant-numeric:tabular-nums}
.period{font-size:12px;color:#ddd;margin-bottom:20px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{min-width:0;display:flex;align-items:center;flex-direction:column;gap:9px}
.crest{height:clamp(58px,11vw,110px);width:clamp(58px,11vw,110px);object-fit:contain;filter:drop-shadow(0 3px 7px #000);display:block}
.name{font-size:clamp(13px,2.5vw,27px);font-weight:900;text-transform:uppercase;overflow-wrap:anywhere}
.score{font-size:clamp(57px,12vw,105px);font-weight:900;line-height:1.05;text-shadow:0 0 20px #f5c54240}
.vs{font-size:22px;color:var(--gold);font-weight:900}
.footer{margin-top:24px;color:var(--gold);font-size:11px;letter-spacing:3px;font-weight:bold}
.controls{padding:16px;background:#191920;color:white}
.controls h3{color:var(--gold);margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
label{font-size:13px}
input,select,button{padding:9px;margin:2px;border-radius:5px;border:1px solid #555;max-width:100%;font:inherit}
input{width:150px}
button{background:var(--gold);color:#111;border:0;font-weight:800;cursor:pointer}
button.dark{background:#383840;color:white}
.goal{position:absolute;inset:0;z-index:5;display:none;overflow:hidden;align-items:center;justify-content:center;background:#07070df5;--accent:#f5c542}
.goal.active{display:flex}
.goal:before{content:"";position:absolute;inset:-30%;opacity:.65;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg,transparent 12deg,var(--accent) 13deg,transparent 15deg);animation:spin 12s linear infinite}
.goal-content{position:relative;z-index:3;width:100%;text-align:center;padding:10px}
.goal-crest{width:clamp(50px,9vw,88px);height:clamp(50px,9vw,88px);object-fit:contain;filter:drop-shadow(0 0 12px var(--accent));margin-bottom:5px}
.goal-team{font-size:clamp(14px,3vw,24px);font-weight:900;letter-spacing:3px;text-transform:uppercase}
.goal-word{font-size:clamp(65px,15vw,145px);font-weight:1000;font-style:italic;line-height:1.08;color:white;-webkit-text-stroke:2px var(--accent);text-shadow:0 0 28px var(--accent);animation:pop .65s ease-out both}
.visual{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.visual .moving{transform-box:fill-box;transform-origin:center;animation:flyAcross 1.4s ease-in-out both}
.visual .slash{stroke-dasharray:500;stroke-dashoffset:500;animation:drawSlash .65s .3s ease-out forwards}
.goal.perth{--accent:#f5c542;background:radial-gradient(ellipse,#4b176f,#08050e 75%)}
.goal.newcastle{--accent:#39c6ff;background:linear-gradient(#031c32,#03070d)}
.goal.auckland{--accent:#00b6f0;background:linear-gradient(#032d52,#031019)}
.goal.macarthur{--accent:#e5e5e5;background:radial-gradient(ellipse,#333,#090909 75%)}
.goal.victory{--accent:#168dff;background:radial-gradient(ellipse,#083f8e,#030914)}
.goal.city{--accent:#61d7ff;background:linear-gradient(#06223b,#050911)}
.goal.sydney{--accent:#00aaff;background:linear-gradient(#00529b,#00152c)}
.goal.wanderers{--accent:#ed252e;background:radial-gradient(ellipse,#4b1016,#080609 75%)}
.goal.mariners{--accent:#00dfd0;background:linear-gradient(#00677c,#001820)}
.goal.adelaide{--accent:#ff303d;background:radial-gradient(ellipse,#65101b,#100609 75%)}
.goal.brisbane{--accent:#ff9b32;background:radial-gradient(ellipse,#60230a,#100704 75%)}
.goal.phoenix{--accent:#ffb52e;background:radial-gradient(ellipse,#6b2408,#100604 75%)}
.goal.perth:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 17%,#fff 17.2%,transparent 17.6% 33%);opacity:0;animation:lightning .55s infinite}
.goal.sydney:before,.goal.mariners:before{background:repeating-linear-gradient(175deg,transparent 0 10%,var(--accent) 10.5%,transparent 12% 24%);animation:wave .8s ease-in-out infinite alternate}
.goal.brisbane .goal-word{position:relative}
.goal.brisbane .goal-word:after{content:"";position:absolute;left:5%;right:5%;top:49%;height:5px;background:#fff;box-shadow:0 -14px 0 var(--accent),0 14px 0 var(--accent);transform:rotate(-15deg);animation:claw .7s .4s both}
.goal.wanderers .goal-word,.goal.adelaide .goal-word{animation:slashWord .55s ease-out}
.goal.phoenix .visual{animation:rise .9s ease-out}
.goal.macarthur .visual{animation:charge .8s ease-in-out}
.goal.newcastle .visual{animation:jetPass 1.2s ease-in-out}
.goal.auckland .visual{animation:shipPass 1.3s ease-in-out}
.goal.city .visual{animation:rocketRise 1s ease-out}
@keyframes pop{0%{transform:scale(.1) rotate(-10deg);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lightning{0%,65%,100%{opacity:0}68%{opacity:.6}70%{opacity:.08}72%{opacity:.8}75%{opacity:0}}
@keyframes wave{from{transform:translateX(-18px) skewY(-3deg)}to{transform:translateX(18px) skewY(3deg)}}
@keyframes drawSlash{to{stroke-dashoffset:0}}
@keyframes claw{from{transform:translateX(-120%) rotate(-15deg);opacity:0}to{transform:translateX(0) rotate(-15deg);opacity:1}}
@keyframes slashWord{from{transform:translateX(-100vw) skewX(-25deg)}to{transform:translateX(0) skewX(0)}}
@keyframes charge{from{transform:translateX(-100vw) scale(1.3)}to{transform:translateX(0) scale(1)}}
@keyframes jetPass{from{transform:translate(-100vw,30px) rotate(-10deg)}to{transform:translate(0,0) rotate(0)}}
@keyframes shipPass{from{transform:translateX(-100vw)}to{transform:translateX(0)}}
@keyframes rocketRise{from{transform:translateY(100vh)}to{transform:translateY(0)}}
@keyframes rise{from{transform:translateY(100vh) scale(.3)}to{transform:translateY(0) scale(1)}}
@media(max-width:500px){.board{padding:17px 6px}.teams{gap:3px}.name{font-size:12px}}
</style>
</head>
<body>
<main class="board" id="board">
  <div class="brand">LIVE FOOTBALL</div>
  <div class="sub">MATCHDAY WATCHALONG</div>
  <div class="clock" id="clock">00:00</div>
  <div class="period" id="periodDisplay">KICK-OFF</div>
  <div class="teams">
    <div class="team">
      <img class="crest" id="homeCrest" alt="Home club crest">
      <div class="name" id="homeName">PERTH GLORY</div>
      <div class="score" id="homeScore">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="team">
      <img class="crest" id="awayCrest" alt="Away club crest">
      <div class="name" id="awayName">OPPONENT</div>
      <div class="score" id="awayScore">0</div>
    </div>
  </div>
  <div class="footer">A-LEAGUE MEN • LIVE</div>

  <div class="goal" id="goalOverlay">
    <svg class="visual" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff"/>
          <stop offset=".45" stop-color="var(--accent)"/>
          <stop offset="1" stop-color="#111"/>
        </linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="art" class="moving" fill="url(#metal)" stroke="var(--accent)" stroke-width="3" filter="url(#glow)">
        <!-- Jet silhouette -->
        <path id="jet" d="M-120 220 L300 190 L410 100 L455 105 L425 190 L570 205 L650 170 L675 178 L630 225 L690 240 L630 255 L675 300 L650 308 L570 275 L425 285 L455 365 L410 370 L300 285 L-120 260 Z" />
        <!-- Ship silhouette -->
        <path id="ship" d="M-120 280 L600 280 L535 340 L70 340 Z M240 95 L250 275 L430 275 Z M220 145 L225 265 L95 265 Z" />
        <!-- Bull silhouette -->
        <path id="bull" d="M-120 160 L80 140 L150 90 L225 105 L280 150 L365 140 L420 170 L395 215 L345 225 L330 300 L295 300 L290 220 L210 225 L185 300 L150 300 L155 210 L65 220 L25 190 L-120 200 Z M150 100 L105 55 L165 78 M210 102 L255 55 L235 105" />
        <!-- City skyline -->
        <path id="skyline" d="M80 340 V220 H145 V340 M160 340 V140 H220 V340 M235 340 V190 H295 V340 M310 340 V85 H385 V340 M400 340 V210 H455 V340 M470 340 V160 H530 V340 M545 340 V240 H600 V340 M70 340 H620" />
        <!-- Lion silhouette -->
        <path id="lion" d="M-100 190 L-25 155 L35 120 L80 145 L125 125 L175 150 L210 195 L190 235 L155 250 L170 300 L140 310 L105 250 L65 250 L50 305 L20 305 L25 235 L-30 220 Z M-20 160 L-55 125 L-15 140 M40 135 L45 95 L75 135 M120 130 L150 95 L150 150" />
        <!-- Phoenix silhouette -->
        <path id="phoenix" d="M400 400 L365 285 L270 250 L150 130 L300 185 L260 80 L375 170 L400 60 L425 170 L540 80 L500 185 L650 130 L530 250 L435 285 Z M400 240 L360 310 L400 290 L440 310 Z" />
        <!-- Wave ribbons -->
        <path id="waves" d="M-50 250 Q100 150 220 250 T500 250 T900 250 L900 310 Q700 210 500 310 T100 310 T-50 310 Z" />
        <!-- Abstract lightning -->
        <path id="bolt" d="M390 -40 L280 205 L385 190 L300 470 L520 150 L405 170 Z" />
      </g>
      <g id="slashes" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
        <path class="slash" d="M280 110 L430 300"/>
        <path class="slash" d="M335 90 L485 280"/>
        <path class="slash" d="M390 75 L540 255"/>
      </g>
      <g id="cityLights" fill="var(--accent)">
        <circle cx="150" cy="210" r="4"/><circle cx="190" cy="170" r="4"/><circle cx="330" cy="120" r="4"/><circle cx="355" cy="155" r="4"/><circle cx="420" cy="245" r="4"/><circle cx="500" cy="185" r="4"/>
      </g>
    </svg>
    <div class="goal-content">
      <img class="goal-crest" id="goalCrest" alt="">
      <div class="goal-team" id="goalTeam">PERTH GLORY</div>
      <div class="goal-word">GOAL!</div>
    </div>
  </div>
</main>

<section class="controls" id="controls">
  <h3>Scoreboard setup</h3>
  <div class="row">
    <label>Home club
      <select id="homeSelect"></select>
    </label>
    <label>Home score <input id="homeScoreInput" type="number" min="0" value="0"></label>
  </div>
  <div class="row">
    <label>Away club
      <select id="awaySelect"></select>
    </label>
    <label>Away score <input id="awayScoreInput" type="number" min="0" value="0"></label>
  </div>
  <div class="row">
    <label>Home crest URL <input id="homeCrestInput" placeholder="Optional image URL"></label>
    <label>Away crest URL <input id="awayCrestInput" placeholder="Optional image URL"></label>
  </div>
  <div class="row">
    <button onclick="updateBoard()">Update Scoreboard</button>
    <button onclick="startClock()">Start Clock</button>
    <button onclick="pauseClock()">Pause Clock</button>
    <button onclick="resetClock()">Reset Clock</button>
  </div>
  <div class="row">
    <label>Set clock minutes <input id="clockSet" type="number" min="0" value="0"></label>
    <button onclick="setClock()">Set Clock</button>
    <label>Period
      <select id="periodSelect" onchange="changePeriod()">
        <option>KICK-OFF</option><option>1ST HALF</option>
        <option>HALF-TIME</option><option>2ND HALF</option>
        <option>EXTRA TIME</option><option>FULL-TIME</option><option>PENALTIES</option>
      </select>
    </label>
  </div>
  <h3>Goal animation</h3>
  <div class="row">
    <label>Scoring club <select id="goalSelect"></select></label>
    <button onclick="testGoal()">Test Goal</button>
    <button class="dark" onclick="hideGoal()">Hide Animation</button>
    <button class="dark" onclick="toggleControls()">Hide Controls</button>
  </div>
  <p style="font-size:12px;color:#bbb">If a club crest doesn't load automatically, paste its direct image URL into the crest field above.</p>
</section>

<script>
const clubs = [
  {name:"Perth Glory",key:"perth",slug:"perth-glory",art:"bolt"},
  {name:"Newcastle Jets",key:"newcastle",slug:"newcastle-jets",art:"jet"},
  {name:"Auckland FC",key:"auckland",slug:"auckland-fc",art:"ship"},
  {name:"Macarthur FC",key:"macarthur",slug:"macarthur",art:"bull"},
  {name:"Melbourne Victory",key:"victory",slug:"melbourne-victory",art:"bolt"},
  {name:"Melbourne City",key:"city",slug:"melbourne-city",art:"skyline"},
  {name:"Sydney FC",key:"sydney",slug:"sydney",art:"waves"},
  {name:"Western Sydney Wanderers",key:"wanderers",slug:"western-sydney-wanderers",art:"bolt"},
  {name:"Central Coast Mariners",key:"mariners",slug:"central-coast-mariners",art:"waves"},
  {name:"Adelaide United",key:"adelaide",slug:"adelaide-united",art:"bolt"},
  {name:"Brisbane Roar",key:"brisbane",slug:"brisbane-roar",art:"lion"},
  {name:"Wellington Phoenix",key:"phoenix",slug:"wellington-phoenix",art:"phoenix"}
];

let elapsed=0;
let timer=null;
let goalTimer=null;
let controlsShown=true;

function crestURL(club){
  return "https://logotyp.us/file/"+club.slug+".svg";
}

function populateSelect(id,selected){
  const select=document.getElementById(id);
  clubs.forEach(c=>{
    const opt=document.createElement("option");
    opt.value=c.key;
    opt.textContent=c.name;
    select.appendChild(opt);
  });
  select.value=selected;
}

function getClub(key){return clubs.find(c=>c.key===key)||clubs[0];}

function setCrest(img,url,club){
  img.onerror=()=>{
    img.onerror=null;
    img.removeAttribute("src");
    img.style.display="none";
  };
  img.src=url||crestURL(club);
  img.style.display="block";
}

function updateBoard(){
  const home=getClub(document.getElementById("homeSelect").value);
  const away=getClub(document.getElementById("awaySelect").value);
  document.getElementById("homeName").textContent=home.name;
  document.getElementById("awayName").textContent=away.name;
  document.getElementById("homeScore").textContent=Math.max(0,Number(document.getElementById("homeScoreInput").value)||0);
  document.getElementById("awayScore").textContent=Math.max(0,Number(document.getElementById("awayScoreInput").value)||0);
  setCrest(document.getElementById("homeCrest"),document.getElementById("homeCrestInput").value.trim(),home);
  setCrest(document.getElementById("awayCrest"),document.getElementById("awayCrestInput").value.trim(),away);
}

function formatTime(s){
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function renderClock(){document.getElementById("clock").textContent=formatTime(elapsed);}
function startClock(){
  if(timer!==null)return;
  timer=setInterval(()=>{elapsed++;renderClock();},1000);
}
function pauseClock(){clearInterval(timer);timer=null;}
function resetClock(){pauseClock();elapsed=0;renderClock();}
function setClock(){pauseClock();elapsed=Math.max(0,Number(document.getElementById("clockSet").value)||0)*60;renderClock();}
function changePeriod(){document.getElementById("periodDisplay").textContent=document.getElementById("periodSelect").value;}

function showGoal(clubKey,teamName){
  const club=getClub(clubKey);
  const overlay=document.getElementById("goalOverlay");
  overlay.className="goal "+club.key;
  document.getElementById("goalTeam").textContent=teamName||club.name;
  const crest=document.getElementById("goalCrest");
  setCrest(crest,"",club);

  document.querySelectorAll("#art #jet,#art #ship,#art #bull,#art #skyline,#art #lion,#art #phoenix,#art #waves,#art #bolt").forEach(el=>el.style.display="none");
  const art=document.getElementById(club.art);
  if(art)art.style.display="block";
  document.getElementById("slashes").style.display=club.key==="brisbane"?"block":"none";
  document.getElementById("cityLights").style.display=club.key==="city"?"block":"none";

  overlay.classList.remove("active");
  void overlay.offsetWidth;
  overlay.classList.add("active");
  clearTimeout(goalTimer);
  goalTimer=setTimeout(hideGoal,5000);
}
function testGoal(){
  const key=document.getElementById("goalSelect").value;
  const club=getClub(key);
  showGoal(key,club.name);
}
function hideGoal(){
  document.getElementById("goalOverlay").classList.remove("active");
  clearTimeout(goalTimer);
}
function toggleControls(){
  controlsShown=!controlsShown;
  document.getElementById("controls").style.display=controlsShown?"block":"none";
}

populateSelect("homeSelect","perth");
populateSelect("awaySelect","newcastle");
populateSelect("goalSelect","perth");
document.getElementById("homeSelect").addEventListener("change",()=>{
  document.getElementById("homeCrestInput").value="";
  updateBoard();
});
document.getElementById("awaySelect").addEventListener("change",()=>{
  document.getElementById("awayCrestInput").value="";
  updateBoard();
});
updateBoard();
renderClock();
</script>
</body>
</html>
